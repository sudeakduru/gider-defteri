<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09090b">
  <title>Gider Defteri</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23146c54'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-size='36' fill='white' font-family='Georgia'%3E₺%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,560;12..96,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=9">
</head>
<body>
  <main id="gate" class="gate">
    <section class="gate-card">
      <span class="brand-mark" aria-hidden="true">₺</span>
      <h1>Gider Defteri</h1>
      <p class="login-note" id="login-note" hidden></p>
      <p class="hint">E-posta ile kaydol veya giriş yap. İstersen Google ya da Apple da kullanabilirsin.</p>
      <form id="email-auth" class="form email-auth" data-mode="login" novalidate>
        <label class="field">E-posta
          <input type="email" name="email" autocomplete="username" inputmode="email" placeholder="ornek@mail.com">
        </label>
        <label class="field">Şifre
          <input type="password" name="password" autocomplete="current-password" placeholder="En az 6 karakter">
        </label>
        <button type="submit" class="btn btn-primary" id="email-submit">Giriş yap</button>
        <button type="button" class="btn btn-ghost" id="email-toggle">Hesabın yok mu? Kaydol</button>
      </form>
      <p class="or-line">veya</p>
      <button type="button" class="auth-btn auth-google" id="login-google">
        <svg viewBox="0 0 24 24" aria-hidden="true" width="18" height="18"><path fill="#4285F4" d="M23 12.3c0-.8-.1-1.6-.2-2.3H12v4.4h6.2a5.3 5.3 0 0 1-2.3 3.5v2.9h3.7c2.2-2 3.4-5 3.4-8.5z"/><path fill="#34A853" d="M12 24c3.2 0 5.8-1 7.7-2.8l-3.7-2.9c-1 .7-2.4 1.2-4 1.2-3.1 0-5.7-2.1-6.6-4.9H1.6v3.1A12 12 0 0 0 12 24z"/><path fill="#FBBC05" d="M5.4 14.6A7.2 7.2 0 0 1 5 12c0-.9.2-1.8.4-2.6V6.3H1.6A12 12 0 0 0 0 12c0 1.9.5 3.8 1.6 5.7l3.8-3.1z"/><path fill="#EA4335" d="M12 4.8c1.7 0 3.3.6 4.5 1.8l3.4-3.4C17.8 1.1 15.2 0 12 0 7.3 0 3.2 2.7 1.6 6.3l3.8 3.1c.9-2.8 3.5-4.6 6.6-4.6z"/></svg>
        Google ile devam et
      </button>
      <button type="button" class="auth-btn auth-apple" id="login-apple">
        <svg viewBox="0 0 24 24" aria-hidden="true" width="18" height="18"><path fill="currentColor" d="M16.4 12.6c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.2-2.8.9-3.5.9s-1.8-.8-3-.8c-1.5 0-3 .9-3.8 2.3-1.6 2.8-.4 7 1.2 9.3.8 1.1 1.7 2.3 2.9 2.3 1.2 0 1.6-.7 3-.7s1.8.7 3 .7 2-.1 2.9-2.3c.7-1 1.2-2 1.5-3.1-3.9-1.5-3.8-4.3-3.8-4.3zM14.3 6.2c.6-.8 1.1-1.9.9-3-1 .1-2.1.6-2.8 1.4-.6.7-1.2 1.8-1 2.9 1.1.1 2.2-.5 2.9-1.3z"/></svg>
        Apple ile devam et
      </button>
    </section>
  </main>
  <div class="shell" id="app" hidden>
    <aside>
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">₺</span>
        <div>
          <strong>Gider Defteri</strong>
          <p class="brand-sub" id="account-label">Hesabın</p>
        </div>
        <button type="button" id="logout" class="logout">Çıkış</button>
      </div>
      <nav class="tabbar" aria-label="Bölümler">
        <button type="button" data-nav="dashboard">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 16V8M10 16V5M16 16v-3M20 16V9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span>Pano</span>
        </button>
        <button type="button" data-nav="overview">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
          <span>Bugün</span>
        </button>
        <button type="button" data-nav="expenses">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span>Harcama</span>
        </button>
        <button type="button" data-nav="fixed">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 3v4M16 3v4M4 10h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span>Sabit</span>
        </button>
        <button type="button" data-nav="debts">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 10h18" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
          <span>Borç</span>
        </button>
        <button type="button" data-nav="people" id="nav-people" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="9" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4 19c.6-2.4 2.5-4 5-4s4.4 1.6 5 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span>Kayıtlar</span>
        </button>
        <button type="button" data-nav="settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="2.2" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
          <span>Gelir</span>
        </button>
      </nav>
    </aside>
    <section class="workspace">
      <div class="monthbar">
        <button type="button" class="icon-btn" data-month="-1" aria-label="Önceki ay">‹</button>
        <div class="month-center">
          <h1 id="month-label"></h1>
          <button type="button" id="salary-link" data-nav="settings">Maaş gir</button>
          <button type="button" id="back-today" data-month="0" hidden>Bu aya dön</button>
        </div>
        <button type="button" class="icon-btn" data-month="1" aria-label="Sonraki ay">›</button>
      </div>
      <div id="view"></div>
    </section>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="config.js?v=9"></script>
  <script src="calc.js?v=9"></script>
  <script src="app.js?v=9"></script>
</body>
</html>
